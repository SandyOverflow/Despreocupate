<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de profesional</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <div class="contenedor-app">
        <header class="cabecera">
            <h1>Registro de profesional</h1>
        </header>

        <main class="contenido">
            <h2>Datos personales</h2>

            <form>
                <div class="grupo-formulario">
                    <label for="nombre">Nombre</label>
                    <div class="contenedor-input">
                        <input type="text" id="nombre">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="apellidos">Apellidos</label>
                    <div class="contenedor-input">
                        <input type="text" id="apellidos">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="correo">Correo<br>electrónico</label>
                    <div class="contenedor-input">
                        <input type="email" id="correo">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="telefono">Teléfono</label>
                    <div class="contenedor-input">
                        <input type="tel" id="telefono">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="contrasena">
                        <span class="icono-toggle" onclick="togglePassword('contrasena', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">Confirmar<br>contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="confirmar-contrasena">
                        <span class="icono-toggle" onclick="togglePassword('confirmar-contrasena', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <button type="button" class="boton-continuar">Continuar</button>
            </form>
        </main>
    </div>

</body>
</html>
