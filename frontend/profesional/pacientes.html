<body>

    <div class="mobile-container">
        <header class="app-header">Mis Pacientes</header>

        <main class="app-content">

            <div class="patient-card">
                <div class="patient-info">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="patient-avatar" alt="Andrés Carmona">
                    <div class="patient-details">
                        <h4>Andrés Carmona</h4>
                        <p>Última cita: ayer</p>
                    </div>
                </div>
                <button class="btn-ficha">Ver ficha clínica</button>
            </div>

            <div class="patient-card">
                <div class="patient-info">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" class="patient-avatar" alt="Rodrigo Pérez">
                    <div class="patient-details">
                        <h4>Rodrigo Pérez</h4>
                        <p>Última cita: 05/02</p>
                    </div>
                </div>
                <button class="btn-ficha">Ver ficha clínica</button>
            </div>

            <div class="patient-card">
                <div class="patient-info">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=100&q=80" class="patient-avatar" alt="Manuela Herrera">

                        <h4>Manuela Herrera</h4>
