<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de paciente</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>

    <div class="contenedor-app">
        <header class="cabecera">
            <h1>Registro de paciente</h1>
        </header>

        <main class="contenido">
            <form onsubmit="registrarPaciente(event)">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre</label>
                    <div class="contenedor-input">
                        <input type="text" id="nombre" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="apellidos">Apellidos</label>
                    <div class="contenedor-input">
                        <input type="text" id="apellidos" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="correo">Correo<br>electrónico</label>
                    <div class="contenedor-input">
                        <input type="email" id="correo" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="telefono">Teléfono</label>
                    <div class="contenedor-input">
                        <input type="tel" id="telefono" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="nacimiento">Fecha<br>nacimiento</label>
                    <div class="contenedor-input">
                        <input type="date" id="nacimiento" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="contrasena" required>
                        <span class="icono-toggle" onclick="togglePassword('contrasena', this)"></span>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">Confirmar<br>contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="confirmar-contrasena" required>
                        <span class="icono-toggle" onclick="togglePassword('confirmar-contrasena', this)"></span>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="tarjeta">Número<br>tarjeta sanitaria</label>
                    <div class="contenedor-input">
                        <input type="text" id="tarjeta" required>
                    </div>
                </div>
                <div class="grupo-formulario">
                    <label for="codigo-postal">Código<br>postal</label>
                    <div class="contenedor-input">
                        <input type="text" id="codigo-postal" required maxlength="5">
                    </div>
                </div>

                <label class="terminos">
                    <input type="checkbox" required>
                    Acepto los términos y condiciones y la política de privacidad
                </label>

                <button type="submit" class="boton-continuar">Crear cuenta</button>
            </form>

            <p class="texto-pie">
                ¿Ya tienes una cuenta? <a href="../login/index.html">Inicia sesión</a>
            </p>
        </main>
    </div>

</body>
</html>
