<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despreocúpate Más - Mi Agenda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="mobile-container">
        <header class="app-header">Mi Agenda</header>

        <main class="app-content">
            <div class="calendar-card">
                <h4>Febrero 2026</h4>
                <div class="calendar-grid">
                    <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
                    <span>8</span><span>9</span><span>10</span><span class="active-day">11</span><span>12</span><span>13</span><span>14</span>
                    <span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
                    <span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span>
                </div>
            </div>
            <div class="agenda-day-card">
                <p class="agenda-date">Jueves 11 de Febrero</p>
                <div class="appointment-item">
                    <span><strong>9:00</strong> - Marta S.</span>
                    <span class="modality">(Presencial)</span>
                </div>
                <div class="appointment-item">
                    <span><strong>11:30</strong> - Jorge G.</span>
                    <span class="modality">(Online)</span>
                </div>
            </div>
            <button class="btn-primary" style="margin-top: 0;">+ Cerrar Agenda</button>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="valoraciones.html" class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Valoraciones</span>
            </a>
            <a href="agenda.html" class="nav-item active">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Agenda</span>
            </a>
            <a href="pacientes.html" class="nav-item">
                <i class="fa-solid fa-user-group"></i>
                <span>Pacientes</span>
            </a>
        </nav>
    </div>

</body>
</html>
