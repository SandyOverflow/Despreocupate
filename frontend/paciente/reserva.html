<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/paciente.css">
    <script src="../js/paciente.js" defer></script>
</head>
<body data-pagina="reserva">

    <div class="contenedor-app">
        <header class="cabecera">
            <h1 id="titulo-pagina">Reserva</h1>
        </header>

        <main class="contenido-paciente">
            <h2 class="titulo-seccion">1. Seleccionar Profesional</h2>
            <div class="rejilla-profesionales" id="lista-profesionales"></div>

            <h2 class="titulo-seccion">2. Seleccionar día</h2>
            <div class="selector">
                <button type="button" class="flecha izq" id="dias-izq" aria-label="Días anteriores"></button>
                <div class="lista-dias" id="lista-dias"></div>
                <button type="button" class="flecha der" id="dias-der" aria-label="Días siguientes"></button>
            </div>

            <h2 class="titulo-seccion">3. Seleccionar hora</h2>
            <div class="lista-horas" id="lista-horas"></div>

            <p class="aviso" id="aviso" role="alert"></p>
            <button type="button" class="boton-azul boton-centrado" id="continuar">Continuar con la reserva</button>
        </main>
