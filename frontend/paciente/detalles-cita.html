<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de cita</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/paciente.css">
    <script src="../js/paciente.js" defer></script>
</head>
<body data-pagina="detalles">

    <div class="contenedor-app">
        <header class="cabecera">
            <a class="atras" href="agenda.html" aria-label="Volver a la agenda"></a>
            <h1>Detalles de cita</h1>
        </header>

        <main class="contenido-paciente">
            <section class="ficha-cita">
                <div class="encabezado">
                    <div class="foto" id="detalle-foto"></div>
                    <div>
                        <h2 id="detalle-nombre"></h2>
                        <span id="detalle-especialidad-titulo"></span>
                    </div>
                </div>
                <div class="contacto">
                    <span>Contacto</span><br>
                    <span id="detalle-correo" style="color:#000"></span>
                </div>
                <dl>
                    <dt>Fecha</dt><dd id="detalle-fecha"></dd>
                    <dt>Hora</dt><dd id="detalle-hora"></dd>
                    <dt>Especialidad</dt><dd id="detalle-especialidad"></dd>
                    <dt>Tipo</dt><dd id="detalle-tipo"></dd>
                    <dt>Estatus</dt><dd class="confirmada" id="detalle-estado"></dd>
                </dl>
            </section>

            <section class="tarjeta-blanca videollamada">
                <svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                <div>Unirse a videollamada<br>Inicio en 15 minutos</div>
            </section>

            <a class="boton-ancho reagendar" href="buscador.html">Reagendar</a>
            <button type="button" class="boton-ancho cancelar" id="cancelar">Cancelar</button>
        </main>

        <nav class="menu-inferior" aria-label="Menú principal">
            <a href="inicio.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
            <a href="buscador.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Profesionales</span></a>
            <a href="agenda.html" class="activo"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Mensajes</span></a>
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Mi perfil</span></a>
        </nav>
    </div>

</body>
</html>
