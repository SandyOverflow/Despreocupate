            <h1>Agenda</h1>

        <main class="contenido-paciente">
            <section class="calendario">
                <div class="mes">
                    <button type="button" class="flecha izq" id="mes-anterior" aria-label="Mes anterior"></button>
                    <span id="mes-actual"></span>
                    <button type="button" class="flecha der" id="mes-siguiente" aria-label="Mes siguiente"></button>
                </div>
                <table>
                    <thead>
                        <tr><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th></tr>
                    </thead>
                    <tbody id="cuerpo-calendario"></tbody>
                </table>
            </section>

            <h2 class="titulo-seccion">Detalles de la cita</h2>
            <section class="tarjeta-cita">
                <div class="foto" id="agenda-foto"></div>
                <div class="info">
                    <span id="agenda-nombre"></span>
                    <small id="agenda-detalle"></small>
                    <span id="agenda-fecha"></span>
                </div>
                <span class="estado" id="agenda-estado"></span>
                <a class="boton-turquesa" href="detalles-cita.html">Ver detalles</a>
            </section>
