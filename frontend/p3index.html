<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despreocúpate Más - Registro Paso 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="mobile-container">
        <header class="app-header">Registro de profesional</header>

        <main class="app-content">
            <h3 class="form-title">Datos personales</h3>
            <form action="registro-paso2.html" method="GET">
                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="input-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required>
                        <i class="fa-regular fa-eye toggle-password" id="toggle-pwd"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                    <button type="button" class="btn-primary" onclick="window.location.href='registro-paso2.html'">Continuar</button>            </form>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="valoraciones.html" class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Valoraciones</span>
            </a>
            <a href="agenda.html" class="nav-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Agenda</span>
            </a>
            <a href="pacientes.html" class="nav-item">
                <i class="fa-solid fa-user-group"></i>
                <span>Pacientes</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
