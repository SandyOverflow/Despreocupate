<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despreocúpate Más - Registro Paso 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="mobile-container">
        <header class="app-header">Registro de profesional</header>

        <main class="app-content">
            <h3 class="form-title">Datos profesionales</h3>
            <form action="agenda.html" method="GET" id="form-step2">
                <div class="input-group">
                    <label>Especialidad</label>
                    <div class="custom-select-wrapper" id="custom-select">
                        <div class="select-selected" id="select-selected">
                            <span>Selecciona tu especialidad</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="select-items select-hide" id="select-items">
                            <div data-value="medicina">Medicina general</div>
                            <div data-value="psicologia">Psicología</div>
                            <div data-value="fisioterapia">Fisioterapia</div>
                            <div data-value="nutricion">Nutrición</div>
                            <div data-value="entrenamiento">Entrenamiento</div>
                            <div data-value="otras">Otras</div>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="colegiado">Número de colegiado</label>
                    <input type="text" id="colegiado" required>
                </div>
                <div class="input-group">
                    <label for="experiencia">Años de experiencia</label>
                    <input type="number" id="experiencia" required>
                </div>
                <div class="input-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" required>
                </div>
                <div class="input-group">
                    <label>Documento acreditativo</label>
                    <label for="file-upload" class="file-upload-box">
                        <i class="fa-solid fa-upload"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;" required>
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
                </div>

                <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="valoraciones.html" class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Valoraciones</span>
            </a>
            <a href="agenda.html" class="nav-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Agenda</span>
            </a>
            <a href="pacientes.html" class="nav-item">
                <i class="fa-solid fa-user-group"></i>
                <span>Pacientes</span>
            </a>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
