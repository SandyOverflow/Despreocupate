<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de profesional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contenedor-app {
            width: 360px;
            height: 640px;
            background: linear-gradient(to bottom, #e6ebf8 0%, #c4f0ec 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .cabecera {
            background-color: #4ac7b6;
            padding: 20px 0;
            text-align: center;
            width: 100%;
        }

        .cabecera h1 {
            color: white;
            font-size: 18px;
            margin: 0;
            font-weight: bold;
        }

        .contenido {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenido h2 {
            font-size: 18px;
            color: #000;
            margin-top: 0;
            margin-bottom: 30px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .grupo-formulario {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grupo-formulario label {
            font-weight: bold;
            font-size: 13px;
            color: #000;
            width: 35%;
            text-align: center;
            line-height: 1.2;
        }

        .contenedor-input {
            width: 60%;
            position: relative;
        }

        .grupo-formulario input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #a3a3a3;
            border-radius: 20px;
            background-color: #fafafa;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .input-con-icono input {
            padding-right: 35px;
        }

        .icono-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icono-toggle:hover {
            color: #000;
        }

        .boton-continuar {
            margin-top: 25px;
            background-color: #2b5f75;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            align-self: center;
        }
        
        .boton-continuar:hover {
            background-color: #1f4556;
        }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <header class="cabecera">
            <h1>Registro de profesional</h1>
        </header>
        
        <main class="contenido">
            <h2>Datos personales</h2>
            
            <form>
                <div class="grupo-formulario">
                    <label for="nombre">Nombre</label>
                    <div class="contenedor-input">
                        <input type="text" id="nombre">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="apellidos">Apellidos</label>
                    <div class="contenedor-input">
                        <input type="text" id="apellidos">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="correo">Correo<br>electrónico</label>
                    <div class="contenedor-input">
                        <input type="email" id="correo">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="telefono">Teléfono</label>
                    <div class="contenedor-input">
                        <input type="tel" id="telefono">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="contrasena">
                        <span class="icono-toggle" onclick="togglePassword('contrasena', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">Confirmar<br>contraseña</label>
                    <div class="contenedor-input input-con-icono">
                        <input type="password" id="confirmar-contrasena">
                        <span class="icono-toggle" onclick="togglePassword('confirmar-contrasena', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <button type="button" class="boton-continuar">Continuar</button>
            </form>
        </main>
    </div>

    <script>
        const svgOjoAbierto = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const svgOjoCerrado = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        function togglePassword(inputId, iconoElement) {
            const input = document.getElementById(inputId);
            
            if (input.type === "password") {
                input.type = "text";
                iconoElement.innerHTML = svgOjoCerrado;
            } else {
                input.type = "password";
                iconoElement.innerHTML = svgOjoAbierto;
            }
        }
    </script>
</body>
</html>
